services:
  - type: web
    name: fasalpramaan-backend
    runtime: python
    repo: https://github.com/umairaalvi4843-hub/fasalpramaan
    plan: free
    region: oregon
    buildCommand: |
      pip install -r backend/requirements.txt
    startCommand: |
      cd backend && uvicorn src.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: EARTH_ENGINE_PROJECT
        value: fasalpramaan-earth-engine
      - key: PYTHON_VERSION
        value: 3.11.0